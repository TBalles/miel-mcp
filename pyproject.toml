[project]
name = "miel-mcp"
version = "0.1.0"
description = "Servidor MCP para consultar MIeL (UNLaM): materias, contenidos, descargas y foros."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
]

[project.scripts]
miel-mcp = "miel_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/miel_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
